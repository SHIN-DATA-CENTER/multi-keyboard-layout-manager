[package]
name = "mklm-helper"
description = "Elevated, short-lived helper that performs MKLM's registry writes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "mklm-helper"
path = "src/main.rs"
# The manifest requires elevation, so a test harness built from this target could not run
# unelevated. Keep the logic in mklm-ipc / mklm-engine, where it is tested.
test = false
doctest = false

[dependencies]
mklm-core.workspace = true
mklm-ipc.workspace = true
mklm-engine.workspace = true
# Verification only: never the `winhttp` feature, the helper has no network code (design m5b A.9).
mklm-update.workspace = true

[target.'cfg(windows)'.dependencies]
mklm-win.workspace = true

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
