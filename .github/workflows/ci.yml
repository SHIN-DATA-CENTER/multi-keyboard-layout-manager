name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, test (x64) + clippy (ARM64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (x64)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test (x64)
        run: cargo test --workspace --locked

      - name: cargo clippy (ARM64)
        run: cargo clippy --workspace --all-targets --locked --target aarch64-pc-windows-msvc -- -D warnings
