[workspace]
resolver = "3"
members = [
    "crates/mklm-core",
    "crates/mklm-win",
    "crates/mklm-ipc",
    "crates/mklm-engine",
    "crates/mklm-client",
    "crates/mklm-update",
    "apps/mklm",
    "apps/mklm-cli",
    "apps/mklm-helper",
    "xtask",
]
exclude = ["prototypes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["SHIN DATA CENTER"]
repository = "https://github.com/SHIN-DATA-CENTER/multi-keyboard-layout-manager"

[workspace.dependencies]
mklm-core = { path = "crates/mklm-core" }
mklm-win = { path = "crates/mklm-win" }
mklm-ipc = { path = "crates/mklm-ipc" }
mklm-engine = { path = "crates/mklm-engine" }
mklm-client = { path = "crates/mklm-client" }
mklm-update = { path = "crates/mklm-update" }
# windows-registry stays on 0.6.x until `windows` itself moves to 0.100 (avoids duplicate windows-result/strings/link).
windows = "0.62.2"
windows-registry = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
embed-resource = "3.0.11"
# GUI (apps/mklm, M3): Slint 1.18 as proven by prototypes/slint-proto (M0 #8). Default features
# (winit backend, femtovg and software renderers, accessibility, system tray) plus the winit 0.30
# accessors. No skia. See docs/design/m3-gui.md C.3 for the renderer choice.
slint = { version = "~1.18", features = ["unstable-winit-030"] }
slint-build = "~1.18"
# settings.toml of the GUI (plan 3.7).
toml = "1.1.6"
# Update manifest signatures (design m5b B.1): exact pin, bumped deliberately.
minisign-verify = "=0.3.0"
# Throwaway test keys only (dev-dependency of mklm-update and xtask). Real keys are handled by the
# official minisign binary alone (design m5b B.1, B.5).
minisign = "0.10.0"
sha2 = "0.11.0"
semver = "1.0.28"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
# The development-only update overrides (design m5b A.10): a misspelled cfg fails clippy -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mklm_update_dev)'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Explicit (design m5b A.10): the development update overrides also need debug_assertions, so a
# release build never contains them even if `--cfg mklm_update_dev` were set by mistake.
debug-assertions = false
