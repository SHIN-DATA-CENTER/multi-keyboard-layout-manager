[package]
name = "mklm-win"
description = "Windows API layer for Multi Keyboard Layout Manager (enumeration, registry, Raw Input)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
mklm-core.workspace = true
thiserror.workspace = true
windows-registry.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Globalization",
    # `RegisterClassW` / `WNDCLASSW` of the helper's hidden session-end window (session_end.rs).
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    # `VARIANT` / `BSTR` of shell_launch (design m5b D.10, G.2).
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    # `WTSEnumerateProcessesW`: the session and user of each GUI process, for the update runner's
    # quit-if-idle (proc_identity::process_users, design m5b D.8).
    "Win32_System_RemoteDesktop",
    # Who holds an installed file open (update_dir::file_holders, design m5b D.8 step 4).
    "Win32_System_RestartManager",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Test builds only: `KUSER_SHARED_DATA` (Wdk_System_SystemServices) is defined only with these two
# features, and a test checks `session::boot_counter`'s offset against it.
[dev-dependencies.windows]
workspace = true
features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel"]

[lints]
workspace = true

[features]
# The WinHTTP client (`net`, design m5b A.9): only mklm-update's `winhttp` feature enables it, which
# the GUI, the CLI and xtask use. The helper never does (release.yml checks its imports).
net = ["windows/Win32_Networking_WinHttp"]
# Win32 pieces of the GUI (apps/mklm, design m3 A.5): the `ui` module. Only apps/mklm enables it.
gui = [
    "windows/Foundation",
    "windows/UI",
    "windows/UI_ViewManagement",
    "windows/Win32_Graphics_Dwm",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_System_DataExchange",
    "windows/Win32_System_Memory",
    "windows/Win32_UI_Accessibility",
]
