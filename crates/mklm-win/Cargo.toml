[package]
name = "mklm-win"
description = "Windows API layer for Multi Keyboard Layout Manager (enumeration, registry, Raw Input)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
mklm-core.workspace = true
thiserror.workspace = true
windows-registry.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true

[features]
# Win32 pieces of the GUI (apps/mklm, design m3 A.5): the `ui` module. Only apps/mklm enables it.
gui = [
    "windows/Foundation",
    "windows/UI",
    "windows/UI_ViewManagement",
    "windows/Win32_Graphics_Dwm",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_System_DataExchange",
    "windows/Win32_System_Memory",
    "windows/Win32_UI_Accessibility",
]
